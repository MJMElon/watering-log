<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Plant Watering Tracker - Login</title>

    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Siram Go!">
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f7f4; /* Light leafy green */
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box; /* Prevents input from overflowing */
            font-size: 16px; /* Prevents iOS from zooming in on focus */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        button:active {
            background-color: #1b5e20;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sw-register.js"></script>
</head>
<body>

<div class="login-container" id="loginContainer" style="visibility: hidden;">
    <h2>🌱 Siram Go! 🚿</h2>
    <p>Sila Log Masuk & Mula Menyiram</p>
    
    <form id="loginForm">
        <input type="email" id="email" placeholder="Emel" required>
        <input type="password" id="password" placeholder="Kata Laluan" required>
        <button type="submit">Log Masuk</button>
    </form>
    
    <p style="margin-top: 15px; font-size: 14px;">
        Pengguna Baru Sila Daftar Di Sini: <a href="signup.html">Daftar</a>
    </p>
</div>
<script>

    // Check if user is already logged in
    const savedUser = localStorage.getItem('loggedInUser');
    if (savedUser) {
        window.location.href = "form.html"; 
    }

    // 1. Connection Details
    const supabaseUrl = 'https://kibqjztozokohqmhqqqf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';

    // 2. Initialize with a unique name to avoid naming conflicts
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Reveal the login form. Called only when we've decided the user actually
    // needs to type credentials — prevents the login form from flashing on
    // screen for a fraction of a second when we're about to redirect.
    function showLoginForm() {
        const el = document.getElementById('loginContainer');
        if (el) el.style.visibility = 'visible';
    }

    // Safety net: if for any reason the async check below hangs, show the form
    // after 1.2s so the user is never stuck on a blank screen.
    setTimeout(showLoginForm, 1200);

    // Fix 2: Session auto-restore — if a valid Supabase session still exists but
    // `loggedInUser` was cleared (e.g. by a false-null logout earlier), silently
    // restore the flag and route them in without asking for credentials again.
    // This ALSO prevents an unnecessary signInWithPassword call, which would
    // rotate the refresh token and could invalidate the user's other devices/tabs.
    (async () => {
        if (savedUser) return; // already redirecting above (login form stays hidden)
        try {
            const { data: { session } = {}, error } = await _supabase.auth.getSession();
            if (error || !session?.user?.email) { showLoginForm(); return; }
            const email = session.user.email;
            localStorage.setItem('loggedInUser', email);
            let landing = 'form.html';
            try {
                const fc = await _supabase.from('watering_field_coordinators')
                    .select('email').eq('email', email).maybeSingle();
                if (fc.data) landing = 'dashboard.html';
            } catch (e) { /* default to form.html */ }
            window.location.href = landing;
        } catch (e) { showLoginForm(); }
    })();

    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // 3. Use _supabase to sign in
        const { data, error } = await _supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Login failed: " + error.message);
        } else {
            // 4. Store the email so form.html can display it in the logs
            localStorage.setItem('loggedInUser', data.user.email);

            // Route Field Coordinators straight to the dashboard
            let landing = 'form.html';
            try {
                const fc = await _supabase.from('watering_field_coordinators')
                    .select('email').eq('email', data.user.email).maybeSingle();
                if (fc.data) landing = 'dashboard.html';
            } catch (e) { /* table missing — default to form.html */ }
            window.location.href = landing;
        }
    });
</script>
</body>
</html>
