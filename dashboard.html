<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Analisis Prestasi Farm</title>
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Siram Go!">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="plots.js"></script>
    <script src="sw-register.js"></script>

    <style>
        :root {
            --primary: #28a745;
            --warning: #ffc107;
            --danger: #d9534f;
            --dark: #343a40;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg); color: #333; margin: 0; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; line-height: 1.2; }
        .nav-btn { text-decoration: none; color: white; background: var(--dark); padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        @media (max-width: 600px) {
            .header h1 { font-size: 22px; flex: 1 1 100%; }
            .header > div:last-child { flex: 0 0 auto; margin-left: auto; }
        }

        .filter-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .filter-item { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: bold; color: #666; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 6px solid #ccc; }
        .stat-num { font-size: 36px; font-weight: bold; margin-top: 5px; }
        
        .breakdown-container { background: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        .breakdown-item { background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px solid #ffe3e3; text-align: center; }

        .table-wrapper { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; }
        .bg-success { background: #d4edda; color: #155724; }
        .bg-warning { background: #fff3cd; color: #856404; }
        .bg-danger { background: #f8d7da; color: #721c24; }
        
        .btn-export { background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; padding: 10px; font-size: 13px; }
        .btn-page { background: var(--dark); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .btn-page:disabled { background: #ccc; cursor: not-allowed; }

        /* Live Work Achievement card */
        .live-ach-card { background: white; padding: 18px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .live-ach-card h2 { margin: 0 0 12px 0; font-size: 17px; text-align: left; }
        .live-ach-meta { display: flex; gap: 15px; font-size: 12px; color: #666; margin-bottom: 12px; flex-wrap: wrap; }
        .live-ach-meta strong { color: #333; }
        .live-ach-meta .live-ach-updated { margin-left: auto; color: #28a745; font-weight: bold; }
        .live-ach-section { margin-bottom: 14px; }
        .live-ach-section h4 { margin: 8px 0 6px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .live-ach-area-total { font-size: 11px; color: #555; font-weight: normal; }
        .live-ach-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .live-ach-plot { width: 35px; font-size: 11px; font-weight: bold; color: #444; flex-shrink: 0; }
        .live-ach-bar { flex: 1; height: 11px; background: #f0f0f0; border-radius: 3px; overflow: hidden; border: 1px solid #ddd; display: flex; }
        .live-ach-fill { height: 100%; background: #28a745; }
        .live-ach-rain { height: 100%; background: #f5a5a5; }
        .live-ach-text { display: inline-flex; align-items: baseline; gap: 6px; min-width: 95px; font-size: 11px; flex-shrink: 0; justify-content: flex-end; }
        .live-ach-pct { font-weight: bold; color: #155724; }
        .live-ach-rounds { font-size: 9px; color: #555; }
        .live-summary-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
        .live-summary-section h4 { margin: 0 0 8px 0; font-size: 14px; }
        .live-summary-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; margin-bottom: 5px; }
        .live-summary-label { width: 160px; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .live-summary-bar { flex: 1; height: 14px; background: #ececec; border-radius: 4px; overflow: hidden; border: 1px solid #ccc; display: flex; }
        .live-summary-fill { height: 100%; background: #28a745; }
        .live-summary-rain { height: 100%; background: #f5a5a5; }
        .live-summary-text { min-width: 100px; font-size: 11px; text-align: right; flex-shrink: 0; }
        .live-summary-text strong { color: #155724; font-size: 14px; }
        .live-summary-text span { color: #555; }
        .live-grand-total { margin-top: 10px; padding: 10px 15px; background: #155724; color: white; border-radius: 6px; }
        .live-grand-header { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .live-grand-total strong { font-size: 16px; }
        .live-grand-bar { height: 10px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; display: flex; }
        .live-grand-fill { height: 100%; background: white; }
        .live-grand-rain { height: 100%; background: #ff8a8a; }
        .live-ach-loading { text-align: center; color: #999; padding: 25px; font-style: italic; font-size: 13px; }

        @media (max-width: 600px) {
            .live-ach-card { padding: 12px 14px; }
            .live-ach-card h2 { font-size: 15px; margin-bottom: 10px; }
            .live-summary-row { padding: 5px 8px; gap: 5px; }
            .live-summary-label { width: 95px; font-size: 10px; }
            .live-summary-bar { height: 10px; }
            .live-summary-text { min-width: 72px; font-size: 9px; }
            .live-summary-text strong { font-size: 11px; }
            .live-grand-total { padding: 8px 12px; }
            .live-grand-header { font-size: 11px; }
            .live-grand-total strong { font-size: 13px; }
            .live-grand-bar { height: 8px; }
            .live-summary-section h4 { font-size: 13px; }
            .live-ach-section h4 { font-size: 12px; }
        }
        .live-dot { display: inline-block; width: 11px; height: 11px; background: #d9534f; border-radius: 50%; margin-right: 8px; vertical-align: middle; animation: live-blink 1.2s ease-in-out infinite; box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.7); }
        @keyframes live-blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.7); }
            50% { opacity: 0.35; box-shadow: 0 0 0 5px rgba(217, 83, 79, 0); }
        }
        .live-dot.offline { background: #888; animation: none; box-shadow: none; }
        .live-ach-cache-tag { color: #888; font-style: italic; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Watering Performance Analytics</h1>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span onclick="showUserBadgePopup(this)" style="color:#666; font-size:13px; cursor:pointer; user-select:none; white-space:nowrap;" title="Tap to show full email">👤 <span id="userBadge"></span></span>
            <a id="homeBtn" href="form.html" class="nav-btn">🏠 Home</a>
        </div>
    </div>

    <div class="live-ach-card">
        <h2><span class="live-dot"></span>Pencapaian Kerja Live</h2>
        <div id="liveAchContent">
            <div class="live-ach-loading">Memuatkan…</div>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div class="filter-item"><label>Mula:</label><input type="date" id="startDate" onchange="loadData()"></div>
            <div class="filter-item"><label>Hingga:</label><input type="date" id="endDate" onchange="loadData()"></div>
            <div class="filter-item">
                <label>Lokasi:</label>
                <select id="locSelect" onchange="syncPlots()">
                    <option value="ALL">Semua Lokasi</option>
                    <option value="BNN">BNN</option><option value="UNN1">UNN1</option><option value="UNN2">UNN2</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Plot:</label>
                <select id="plotSelect" onchange="runFilter()"><option value="ALL">Semua Plot</option></select>
            </div>
            <div class="filter-item">
                <label>Pekerja:</label>
                <select id="workerSelect" onchange="runFilter()"><option value="ALL">Semua Pekerja</option></select>
            </div>
            <button class="btn-export" onclick="downloadCSV()">📥 Export CSV</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card" style="border-top-color: var(--primary);">
            <div style="color:#888; font-size: 13px;">Berjaya (>50m)</div>
            <div id="statSuccess" class="stat-num" style="color: var(--primary);">0</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--warning);">
            <div style="color:#888; font-size: 13px;">Separuh (<50m)</div>
            <div id="statPartial" class="stat-num" style="color: #b08a00;">0</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--danger);">
            <div style="color:#888; font-size: 13px;">Total Isu</div>
            <div id="statTotalIssue" class="stat-num" style="color: var(--danger);">0</div>
        </div>
    </div>

    <div class="breakdown-container">
        <h3 style="margin:0; color: #d9534f; font-size: 16px;">🔍 Ringkasan Isu</h3>
        <div id="issueBreakdownArea" class="breakdown-grid"></div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Tarikh & Masa</th>
                    <th>Plot</th>
                    <th>Status</th>
                    <th>Durasi (m)</th>
                    <th>Pekerja</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button id="prevBtn" class="btn-page" onclick="changePage(-1)">⬅️</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" class="btn-page" onclick="changePage(1)">➡️</button>
    </div>
</div>

<script>
    const db = new Dexie("SiramGoDB");
    db.version(1).stores({
        pending_queue: '++id, plot_name, timestamp'
    });

    // Check if user is already logged in
    const currentUser = localStorage.getItem('loggedInUser');
    if (!currentUser) {
        window.location.href = "index.html";
    }
    
    const supabaseUrl = 'https://kibqjztozokohqmhqqqf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Session validity check — only kicks out when online AND getSession()
    // returns a genuinely empty session (no error). Network hiccups, Supabase
    // 5xx, and refresh-token races populate the `error` field — those are
    // inconclusive and must NOT trigger a logout.
    (async () => {
        if (!currentUser) return;
        if (!navigator.onLine) return;
        try {
            const { data: { session } = {}, error } = await _supabase.auth.getSession();
            if (!session && !error) {
                localStorage.removeItem('loggedInUser');
                alert('Sesi tamat. Sila log masuk semula.');
                window.location.href = 'index.html';
            }
        } catch (e) { /* getSession threw (rare) — leave user alone */ }
    })();

    // WHITELIST GATE — allow admin, worker, or FC only. Block merged-app users
    // who signed up on the sister app but shouldn't see Siram Go! data.
    // Skipped offline so legitimate users aren't falsely blocked with expired
    // tokens or captive-portal issues. Network/RLS errors fail-open so a
    // Supabase hiccup doesn't lock the whole team out.
    (async () => {
        if (!currentUser) return;
        if (!navigator.onLine) return;
        try {
            const [adminRes, workerRes, fcRes] = await Promise.all([
                _supabase.from('watering_admins').select('email').eq('email', currentUser).maybeSingle(),
                _supabase.from('watering_workers').select('email').eq('email', currentUser).maybeSingle(),
                _supabase.from('watering_field_coordinators').select('email').eq('email', currentUser).maybeSingle()
            ]);
            const isAllowed = !!adminRes.data || !!workerRes.data || !!fcRes.data;
            if (!isAllowed) {
                alert('Akaun anda tidak dibenarkan mengakses Siram Go!');
                try { await _supabase.auth.signOut(); } catch (e) { /* offline OK */ }
                localStorage.removeItem('loggedInUser');
                window.location.href = 'index.html';
            }
        } catch (e) {
            // Network / RLS error — do NOT block. Try again next page load.
            console.error('whitelist check:', e);
        }
    })();

    let fullData = [];
    let filteredData = [];
    let currentPage = 1;
    const recordsPerPage = 10;

    // ----- LIVE WORK ACHIEVEMENT (current month, polling) -----
    let liveAchConfig = null; // { targets, operators } cached once per page session
    let liveAchPollTimer = null;
    const LIVE_ACH_POLL_INTERVAL = 60000; // 60s

    async function fetchLiveAchConfig() {
        try {
            const [seedRes, opsRes] = await Promise.all([
                _supabase.from('watering_plot_seedlings').select('plot_name, target_per_day'),
                _supabase.from('watering_area_operators').select('area_code, operator_name')
            ]);
            const targets = {};
            if (seedRes.data) for (const r of seedRes.data) targets[r.plot_name] = r.target_per_day || 0;
            const operators = {};
            if (opsRes.data) for (const r of opsRes.data) operators[r.area_code] = r.operator_name || '';
            return { targets, operators };
        } catch (e) {
            console.error('liveAch config:', e);
            return { targets: {}, operators: {} };
        }
    }

    async function fetchLiveAchSessions() {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth() + 1;
        const startDate = `${y}-${String(m).padStart(2, '0')}-01`;
        const nm = m === 12 ? 1 : m + 1;
        const ny = m === 12 ? y + 1 : y;
        const endDate = `${ny}-${String(nm).padStart(2, '0')}-01`;

        // Supabase default response is capped at 1000 rows. Paginate to fetch
        // the entire month, otherwise recent inserts get silently dropped.
        const PAGE = 1000;
        let allRows = [];
        let from = 0;
        for (;;) {
            const { data, error } = await _supabase.from('watering_logs')
                .select('plot_name, duration, issue_reason, end_time, start_time')
                .gte('end_time', startDate + 'T00:00:00')
                .lt('end_time', endDate + 'T00:00:00')
                .order('id', { ascending: true })
                .range(from, from + PAGE - 1);
            if (error) {
                console.error('liveAch sessions:', error);
                return { sessions: {}, rainingDays: {} };
            }
            allRows = allRows.concat(data || []);
            if (!data || data.length < PAGE) break;
            from += PAGE;
        }

        const sessions = {};
        const rainingDateSets = {};
        for (const r of allRows) {
            if (r.issue_reason === 'Hujan') {
                const isoDate = (r.end_time || r.start_time || '').slice(0, 10);
                if (isoDate) {
                    const plotsToMark = plotData[r.plot_name] || [r.plot_name];
                    for (const p of plotsToMark) {
                        if (!rainingDateSets[p]) rainingDateSets[p] = new Set();
                        rainingDateSets[p].add(isoDate);
                    }
                }
                continue;
            }
            if (r.issue_reason !== null) continue;
            if ((r.duration || 0) < 50) continue;
            sessions[r.plot_name] = (sessions[r.plot_name] || 0) + 1;
        }
        const rainingDays = {};
        for (const plot in rainingDateSets) rainingDays[plot] = rainingDateSets[plot].size;
        return { sessions, rainingDays };
    }

    function renderLiveAchievement(sessions, rainingDays, fetchedAtIso, isCached) {
        const container = document.getElementById('liveAchContent');
        if (!container) return;
        const { targets = {}, operators = {} } = liveAchConfig || {};
        const now = new Date();
        const fetchedAt = fetchedAtIso ? new Date(fetchedAtIso) : now;
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const fmtNumber = (n) => Number(n).toLocaleString('en-MY');

        // Toggle the header dot between live (red, blinking) and offline (gray, static)
        const dot = document.querySelector('.live-ach-card .live-dot');
        if (dot) dot.classList.toggle('offline', !!isCached);

        let grandSessions = 0, grandTarget = 0, grandRain = 0;
        const areaSummaries = [];

        const areaSections = ['BNN', 'UNN1', 'UNN2'].map(area => {
            const plots = plotData[area] || [];
            const operator = operators[area] || '';
            let areaSessions = 0, areaTarget = 0, areaRain = 0;
            const rows = plots.map(plot => {
                const s = sessions[plot] || 0;
                const t = targets[plot] || 0;
                const rd = rainingDays[plot] || 0;
                const target = t * daysInMonth;
                const rainRounds = rd * t;
                areaSessions += s; areaTarget += target; areaRain += rainRounds;
                const pct = target > 0 ? Math.round((s / target) * 100) : 0;
                const rainPct = target > 0 ? Math.round((rainRounds / target) * 100) : 0;
                const gw = Math.min(100, pct);
                const rw = Math.max(0, Math.min(100 - gw, rainPct));
                const rdHint = rd > 0 ? ` · 🌧${rd}h` : '';
                return `
                    <div class="live-ach-row">
                        <div class="live-ach-plot">${plot}</div>
                        <div class="live-ach-bar"><div class="live-ach-fill" style="width:${gw}%;"></div><div class="live-ach-rain" style="width:${rw}%;"></div></div>
                        <div class="live-ach-text"><span class="live-ach-pct">${pct}%</span><span class="live-ach-rounds">${s}/${fmtNumber(target)}${rdHint}</span></div>
                    </div>`;
            }).join('');

            const areaPct = areaTarget > 0 ? Math.round((areaSessions / areaTarget) * 100) : 0;
            const areaRainPct = areaTarget > 0 ? Math.round((areaRain / areaTarget) * 100) : 0;
            grandSessions += areaSessions; grandTarget += areaTarget; grandRain += areaRain;
            areaSummaries.push({ area, operator, sessions: areaSessions, target: areaTarget, rainingRounds: areaRain, pct: areaPct, rainPct: areaRainPct });

            const areaRainHint = areaRain > 0 ? ` <span style="color:#d9534f;">+ ${areaRain} Hujan</span>` : '';
            return `
                <div class="live-ach-section">
                    <h4>${area} — ${operator}<span class="live-ach-area-total">${areaPct}% (${areaSessions}/${fmtNumber(areaTarget)})${areaRainHint}</span></h4>
                    ${rows}
                </div>`;
        }).join('');

        const grandPct = grandTarget > 0 ? Math.round((grandSessions / grandTarget) * 100) : 0;
        const grandRainPct = grandTarget > 0 ? Math.round((grandRain / grandTarget) * 100) : 0;
        const summaryRows = areaSummaries.map(s => {
            const gw = Math.min(100, s.pct);
            const rw = Math.max(0, Math.min(100 - gw, s.rainPct));
            const rainTxt = s.rainingRounds > 0 ? ` <span style="color:#d9534f; font-size:10px;">+${s.rainPct}% 🌧</span>` : '';
            return `
                <div class="live-summary-row">
                    <div class="live-summary-label">${s.area} — ${s.operator}</div>
                    <div class="live-summary-bar"><div class="live-summary-fill" style="width:${gw}%;"></div><div class="live-summary-rain" style="width:${rw}%;"></div></div>
                    <div class="live-summary-text"><strong>${s.pct}%</strong>${rainTxt} <span>${s.sessions}/${fmtNumber(s.target)}</span></div>
                </div>`;
        }).join('');

        const monthName = now.toLocaleDateString('en-MY', { month: 'short', year: 'numeric' });
        const sameDay = fetchedAt.toDateString() === now.toDateString();
        const updatedAt = sameDay
            ? fetchedAt.toLocaleTimeString('ms-MY')
            : fetchedAt.toLocaleString('ms-MY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const cacheTag = isCached ? ' <span class="live-ach-cache-tag">(Cache)</span>' : '';

        container.innerHTML = `
            <div class="live-ach-meta">
                <span>Bulan: <strong>${monthName}</strong></span>
                <span>Hari: <strong>${daysInMonth}</strong></span>
                <span class="live-ach-updated">Kemas kini: ${updatedAt}${cacheTag}</span>
            </div>
            ${areaSections}
            <div class="live-summary-section">
                <h4>Ringkasan Ikut Area</h4>
                ${summaryRows}
                <div class="live-grand-total">
                    <div class="live-grand-header">
                        <span>Keseluruhan</span>
                        <span><strong>${grandPct}%</strong>${grandRain > 0 ? ` <span style="color:#ff8a8a; font-size:12px;">+ ${grandRainPct}% Hujan (${grandRain})</span>` : ''} <span style="opacity:0.85;">(${grandSessions}/${fmtNumber(grandTarget)})</span></span>
                    </div>
                    <div class="live-grand-bar">
                        <div class="live-grand-fill" style="width:${Math.min(100, grandPct)}%;"></div>
                        <div class="live-grand-rain" style="width:${Math.max(0, Math.min(100 - Math.min(100, grandPct), grandRainPct))}%;"></div>
                    </div>
                </div>
            </div>`;
    }

    // Persist last successful payload so the card works offline.
    const LIVE_ACH_CACHE_KEY = 'liveAchCache_v1';

    function isMeaningfulConfig(cfg) {
        if (!cfg) return false;
        const t = Object.keys(cfg.targets || {}).length;
        const o = Object.keys(cfg.operators || {}).length;
        return t > 0 || o > 0;
    }

    function saveLiveAchCache(sessions, rainingDays) {
        // Only cache if we actually have meaningful config. Otherwise a failed fetch
        // would overwrite good cached data with empties and offline mode would show 0s.
        if (!isMeaningfulConfig(liveAchConfig)) return;
        try {
            localStorage.setItem(LIVE_ACH_CACHE_KEY, JSON.stringify({
                fetchedAt: new Date().toISOString(),
                config: liveAchConfig,
                sessions,
                rainingDays
            }));
        } catch (e) { /* quota / private mode — ignore, in-memory render still works */ }
    }

    function renderFromLiveAchCache() {
        try {
            const raw = localStorage.getItem(LIVE_ACH_CACHE_KEY);
            if (!raw) return false;
            const cached = JSON.parse(raw);
            if (!isMeaningfulConfig(cached?.config)) return false;
            liveAchConfig = cached.config;
            renderLiveAchievement(cached.sessions || {}, cached.rainingDays || {}, cached.fetchedAt, true);
            return true;
        } catch (e) { return false; }
    }

    async function refreshLiveAchievement() {
        // Skip network attempt entirely when offline — keeps the existing cached
        // render visible instead of blanking it out to 0% across the board.
        if (!navigator.onLine) {
            // If nothing is currently rendered (first visit while offline), try cache once.
            if (!liveAchConfig) renderFromLiveAchCache();
            return;
        }

        try {
            // Run config + sessions in parallel — cuts total wait roughly in half
            const [freshConfig, sessionsResult] = await Promise.all([
                fetchLiveAchConfig(),
                fetchLiveAchSessions()
            ]);
            const sessions = sessionsResult.sessions || {};
            const rainingDays = sessionsResult.rainingDays || {};

            // The internal fetchers swallow network errors and return empty objects.
            // If BOTH config and sessions came back empty, treat it as a soft failure
            // (offline transition, RLS hiccup) and DO NOT overwrite the existing render.
            const configEmpty = !isMeaningfulConfig(freshConfig);
            const sessionsEmpty = Object.keys(sessions).length === 0 && Object.keys(rainingDays).length === 0;
            if (configEmpty && sessionsEmpty) {
                if (!liveAchConfig) renderFromLiveAchCache(); // first visit with no in-memory data → try cache
                return;
            }

            // Only replace config in memory if the fresh fetch returned meaningful data.
            if (isMeaningfulConfig(freshConfig)) liveAchConfig = freshConfig;
            else if (!liveAchConfig) liveAchConfig = freshConfig;
            renderLiveAchievement(sessions, rainingDays, new Date().toISOString(), false);
            saveLiveAchCache(sessions, rainingDays);
        } catch (e) {
            console.error('refreshLiveAchievement:', e);
            // Network threw — fall back to cached data so the card still loads offline.
            // Only show the "no data" message if there's nothing rendered yet.
            if (!liveAchConfig && !renderFromLiveAchCache()) {
                const c = document.getElementById('liveAchContent');
                if (c) c.innerHTML = '<div class="live-ach-loading">⚠️ Tiada data tersedia offline. Sambung ke internet untuk muat data buat kali pertama.</div>';
            }
        }
    }

    function startLiveAchievementPolling() {
        // Render cached data first (instant, works offline) then refresh from network
        renderFromLiveAchCache();
        refreshLiveAchievement();
        // Poll while tab is visible
        liveAchPollTimer = setInterval(() => {
            if (!document.hidden) refreshLiveAchievement();
        }, LIVE_ACH_POLL_INTERVAL);
        // Immediate refresh when tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshLiveAchievement();
        });
        // Immediate refresh when network comes back online
        window.addEventListener('online', refreshLiveAchievement);
    }

    function syncPlots() {
        const loc = document.getElementById('locSelect').value;
        const plotDropdown = document.getElementById('plotSelect');
        plotDropdown.innerHTML = '<option value="ALL">Semua Plot</option>';
        if (loc !== "ALL" && plotData[loc]) {
            plotData[loc].forEach(p => plotDropdown.add(new Option(p, p)));
        }
        runFilter();
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function getMonthStart() {
        const d = new Date();
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
    }
    function getToday() {
        const d = new Date();
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    async function loadData() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        // Paginate to bypass the 1000-row Supabase default cap, otherwise
        // long date ranges miss the most recent rows.
        const PAGE = 1000;
        let allRows = [];
        let from = 0;
        for (;;) {
            let query = _supabase.from('watering_logs').select('*')
                .order('end_time', { ascending: false })
                .range(from, from + PAGE - 1);
            if (start) query = query.gte('end_time', start + 'T00:00:00');
            if (end) query = query.lte('end_time', end + 'T23:59:59');

            const { data, error } = await query;
            if (error) return console.error(error);
            allRows = allRows.concat(data || []);
            if (!data || data.length < PAGE) break;
            from += PAGE;
        }
        fullData = allRows;
        populateWorkerDropdown();
        runFilter();
    }

    function populateWorkerDropdown() {
        const select = document.getElementById('workerSelect');
        if (!select) return;
        const current = select.value || 'ALL';
        const workers = [...new Set(fullData.map(d => d.user_email).filter(Boolean))].sort();
        select.innerHTML = '<option value="ALL">Semua Pekerja</option>';
        workers.forEach(email => {
            const opt = document.createElement('option');
            opt.value = email;
            opt.text = email.split('@')[0]; // show account name only
            select.add(opt);
        });
        // Preserve previous selection if still valid
        if (current !== 'ALL' && workers.includes(current)) select.value = current;
    }

    function runFilter() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const loc = document.getElementById('locSelect').value;
        const plot = document.getElementById('plotSelect').value;

        let filtered = fullData;

        // CHANGE 2: Filter logic now uses end_time for date range
        // We use end_time ? end_time : start_time as a fallback for issue reports
        if (start) {
            filtered = filtered.filter(d => (d.end_time || d.start_time) >= start + 'T00:00:00');
        }
        if (end) {
            filtered = filtered.filter(d => (d.end_time || d.start_time) <= end + 'T23:59:59');
        }
        
        if (loc !== "ALL") filtered = filtered.filter(d => d.plot_name.startsWith(loc) || (plotData[loc] && plotData[loc].includes(d.plot_name)));
        if (plot !== "ALL") filtered = filtered.filter(d => d.plot_name === plot);

        const worker = document.getElementById('workerSelect').value;
        if (worker !== "ALL") filtered = filtered.filter(d => d.user_email === worker);

        currentPage = 1;
        calculateStats(filtered);
    }

    function calculateStats(data) {
        let successCount = 0;
        let partialCount = 0;
        let totalIssueCount = 0;
        let issueTypes = {};

        data.forEach(row => {
            const isIssue = row.issue_reason !== null;
            const isPartial = !isIssue && row.duration < 50;
            if (isIssue) {
                // Area-wide issues (plot_name = area code) count once per plot in that area
                const multiplier = plotData[row.plot_name] ? plotData[row.plot_name].length : 1;
                totalIssueCount += multiplier;
                issueTypes[row.issue_reason] = (issueTypes[row.issue_reason] || 0) + multiplier;
            } else if (isPartial) {
                partialCount++;
            } else {
                successCount++;
            }
        });

        filteredData = data;
        renderTablePage();

        document.getElementById('statSuccess').innerText = successCount;
        document.getElementById('statPartial').innerText = partialCount;
        document.getElementById('statTotalIssue').innerText = totalIssueCount;

        const breakdownArea = document.getElementById('issueBreakdownArea');
        if (totalIssueCount === 0) {
            breakdownArea.innerHTML = '<p style="color:#999; font-size:13px; text-align:center; padding:10px;">Tiada isu dikesan.</p>';
        } else {
            breakdownArea.innerHTML = Object.keys(issueTypes).map(type => `
                <div class="breakdown-item" style="border:1px solid #fee; background:#fffafa; border-radius:8px; padding:10px; text-align:center;">
                    <div style="font-size:11px; color:#d9534f; font-weight:bold; text-transform:uppercase;">${type}</div>
                    <div style="font-size:20px; font-weight:bold; color:#333;">${issueTypes[type]}</div>
                </div>`).join('');
        }
    }

    function renderTablePage() {
        const tbody = document.getElementById('dataTable');
        const fmtTime = (t) => new Date(t).toLocaleTimeString('ms-MY', { hour12: false, hour: '2-digit', minute: '2-digit' });

        const start = (currentPage - 1) * recordsPerPage;
        const pageItems = filteredData.slice(start, start + recordsPerPage);

        if (pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px; color:#999;">Tiada rekod dijumpai.</td></tr>';
        } else {
            const rows = pageItems.map(row => {
                const isIssue = row.issue_reason !== null;
                const isPartial = !isIssue && row.duration < 50;
                let badgeClass = 'bg-success';
                let statusText = 'Berjaya';
                if (isIssue) {
                    badgeClass = 'bg-danger';
                    statusText = '⚠️ ' + row.issue_reason;
                } else if (isPartial) {
                    badgeClass = 'bg-warning';
                    statusText = '🟡 Separuh';
                }
                const displayDateObj = row.end_time ? new Date(row.end_time) : new Date(row.start_time);
                const formattedDate = displayDateObj.toLocaleDateString('ms-MY');
                const startTimeStr = row.start_time ? fmtTime(row.start_time) : '-';
                const endTimeStr = row.end_time ? fmtTime(row.end_time) : '-';
                const plotLabel = plotData[row.plot_name] ? `🌍 Semua ${row.plot_name}` : row.plot_name;
                return `
                    <tr>
                        <td style="font-size: 13px;">
                            ${formattedDate}<br>
                            <small style="color:#999;">Mula:</small> <strong style="color:#28a745;">${startTimeStr}</strong><br>
                            <small style="color:#999;">Tamat:</small> <strong style="color:#28a745;">${endTimeStr}</strong>
                        </td>
                        <td><strong>${plotLabel}</strong></td>
                        <td><span class="badge ${badgeClass}" style="font-size:10px; padding: 4px 8px;">${statusText}</span></td>
                        <td style="font-weight:bold;">${row.duration || 0} <small style="color:#999; font-weight:normal;">min</small></td>
                        <td style="color:#999; font-size:11px; vertical-align:middle;">${row.user_email ? row.user_email.split('@')[0] : '-'}</td>
                    </tr>`;
            });
            tbody.innerHTML = rows.join('');
        }

        const totalPages = Math.max(1, Math.ceil(filteredData.length / recordsPerPage));
        document.getElementById('pageInfo').innerText = `Page ${currentPage} / ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(dir) {
        const totalPages = Math.max(1, Math.ceil(filteredData.length / recordsPerPage));
        const newPage = currentPage + dir;
        if (newPage < 1 || newPage > totalPages) return;
        currentPage = newPage;
        renderTablePage();
        const tableTop = document.querySelector('.table-wrapper');
        if (tableTop) tableTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function downloadCSV() {
        let csv = "Tarikh,Mula,Tamat,Plot,Status,Durasi,User\n";
        const fmtTime = (t) => new Date(t).toLocaleTimeString('ms-MY', { hour12: false, hour: '2-digit', minute: '2-digit' });

        filteredData.forEach(row => {
            const isIssue = row.issue_reason !== null;
            const isPartial = !isIssue && row.duration < 50;
            const statusText = (isIssue ? row.issue_reason : (isPartial ? 'Separuh' : 'Berjaya')).replace(/,/g, '');
            const displayDateObj = row.end_time ? new Date(row.end_time) : new Date(row.start_time);
            const dateStr = displayDateObj.toLocaleDateString('ms-MY');
            const mulaPart = row.start_time ? fmtTime(row.start_time) : '-';
            const tamatPart = row.end_time ? fmtTime(row.end_time) : '-';
            const plotDisplay = plotData[row.plot_name] ? `Semua ${row.plot_name}` : (row.plot_name || '');
            const plotPart = plotDisplay.replace(/,/g, '');
            const userPart = (row.user_email ? row.user_email.split('@')[0] : '-').replace(/,/g, '');
            const durPart = String(row.duration || 0);
            csv += `${dateStr},${mulaPart},${tamatPart},${plotPart},${statusText},${durPart},${userPart}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = `Farm_Analytics_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    }

    let userBadgePopupTimer = null;
    function showUserBadgePopup(anchor) {
        if (!currentUser) return;
        closeUserBadgePopup();
        const popup = document.createElement('div');
        popup.id = 'userBadgePopup';
        popup.textContent = currentUser;
        popup.style.cssText = 'position:fixed; background:#333; color:white; padding:6px 10px; border-radius:6px; font-size:13px; white-space:nowrap; z-index:10000; box-shadow:0 2px 8px rgba(0,0,0,0.2);';
        const rect = anchor.getBoundingClientRect();
        popup.style.top = (rect.bottom + 5) + 'px';
        popup.style.left = Math.max(8, Math.min(window.innerWidth - 250, rect.right - 200)) + 'px';
        document.body.appendChild(popup);
        userBadgePopupTimer = setTimeout(closeUserBadgePopup, 2500);
        anchor.addEventListener('mouseleave', closeUserBadgePopup, { once: true });
    }
    function closeUserBadgePopup() {
        const popup = document.getElementById('userBadgePopup');
        if (popup) popup.remove();
        if (userBadgePopupTimer) { clearTimeout(userBadgePopupTimer); userBadgePopupTimer = null; }
    }

    async function hideHomeIfFC() {
        try {
            const { data } = await _supabase.from('watering_field_coordinators')
                .select('email').eq('email', currentUser).maybeSingle();
            if (data) {
                const home = document.getElementById('homeBtn');
                if (home) home.style.display = 'none';
            }
        } catch (e) { /* table missing or error — leave button visible */ }
    }

    window.onload = () => {
        const badge = document.getElementById('userBadge');
        if (badge && currentUser) badge.textContent = currentUser.split('@')[0];

        hideHomeIfFC();
        document.getElementById('startDate').value = getMonthStart();
        document.getElementById('endDate').value = getToday();
        loadData();
        startLiveAchievementPolling();
    };

    async function logout() {
        const count = await db.pending_queue.count();
        if (count > 0) {
            if (!confirm("You have " + count + " records not uploaded. Logout anyway?")) return;
        }
        // Clear the Supabase session too — otherwise index.html's auto-restore
        // detects the still-valid session and bounces the user back in.
        try { await _supabase.auth.signOut(); } catch (e) { /* offline OK — local state is cleared regardless */ }
        localStorage.removeItem('loggedInUser');
        window.location.href = "index.html";
    }
</script>

        Log Keluar
    </button>
